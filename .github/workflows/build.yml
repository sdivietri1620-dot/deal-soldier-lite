name: Build Windows .exe

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'

      - name: Install dependencies
        run: npm install

      - name: Install pkg
        run: npm install -g pkg

      - name: Build .exe
        run: pkg . --targets node18-win-x64 --output deal-soldier-lite.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deal-soldier-lite-exe
          path: deal-soldier-lite.exe
